# v4.26: browser dependencies are loaded with native runtime import() so the
# worker remains compatible even if Netlify emits shared code as CommonJS.
# Keep these packages external so Chromium can resolve its bundled Brotli assets.
[functions."process-audit-background"]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]
